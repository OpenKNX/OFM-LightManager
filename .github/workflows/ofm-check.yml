# Baut bei jedem Push die knxprod und die Release-Firmware aller OAMs, die den LightManager nutzen, mit genau diesem Commit.
on: [push]

jobs:
  check:
    name: Check '${{ matrix.oam }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - oam: OAM-HueGateway
            KNXPROD_PREFIX: HueGateway
          - oam: OAM-NeoPixel
            KNXPROD_PREFIX: NeoPixel

    uses: openknx/actions/.github/workflows/openknx-ofm-check.yml@v0
    with:
      ofm_prefix: LMG
      oam: ${{ matrix.oam }}
      # Fest gesetzt: Die automatische Branch-Wahl im zentralen Workflow greift derzeit nicht und nähme sonst v1.
      oam_ref: v1dev
      target: Release
      KNXPROD_PREFIX: ${{ matrix.KNXPROD_PREFIX }}
